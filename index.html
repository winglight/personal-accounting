<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eef3eb" />
    <script>
      // Apply before CSS or React paints; keep in sync with src/utils/theme.ts.
      (() => {
        var theme = 'forest';
        var colors = { warm: '#f4f1ea', graphite: '#181a1d', forest: '#eef3eb', amber: '#fbf3e2', violet: '#f5f0f7' };
        try {
          var saved = localStorage.getItem('pa-accounting-theme');
          if (saved !== null) {
            theme = Object.prototype.hasOwnProperty.call(colors, saved) ? saved : 'forest';
          } else {
            var legacy = localStorage.getItem('theme');
            if (legacy === 'light') theme = 'warm';
            else if (legacy === 'dark') theme = 'graphite';
          }
        } catch (_) { /* The default also works without storage. */ }
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.classList.toggle('dark', theme === 'graphite');
        root.classList.toggle('light', theme !== 'graphite');
        root.style.colorScheme = theme === 'graphite' ? 'dark' : 'light';
        root.style.backgroundColor = colors[theme];
        document.querySelector('meta[name="theme-color"]').content = colors[theme];
      })();
    </script>
    <title>Personal Accounting</title>
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('
'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  <a href="https://broyustudio.com/" target="_blank" rel="noopener" title="broyustudio.com" aria-label="broyustudio.com" style="position:fixed;bottom:24px;right:24px;z-index:9999;width:52px;height:52px;border-radius:50%;background:#246443;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(26,59,37,.25);transition:background .2s,transform .2s;" onmouseover="this.style.background='#17482e';this.style.transform='translateY(-2px)'" onmouseout="this.style.background='#246443';this.style.transform='none'"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg></a>
  </body>
</html>
